[package]
name = "iroh_ssh_proxy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
iroh = "0.94"
tokio = { version = "1", features = ["macros", "io-util", "sync", "rt", "net"] }
anyhow = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
