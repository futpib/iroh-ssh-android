[package]
name = "iroh_ssh_proxy"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { git = "https://github.com/futpib/flutter_rust_bridge", branch = "master" }
iroh-ssh = { git = "https://github.com/futpib/iroh-ssh", branch = "flutter", default-features = false, features = ["flutter"] }
tokio = { version = "1", features = ["macros", "io-util", "sync", "rt", "net"] }
anyhow = "1"
log = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
