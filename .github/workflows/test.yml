name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  openkeychain-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check shared plugin
        working-directory: packages/openkeychain_ssh
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test example/lib
          flutter analyze
          flutter test

      - name: Compile Android plugin and instrumentation tests
        working-directory: packages/openkeychain_ssh/example
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug
          cd android
          ./gradlew :openkeychain_ssh:assembleDebugAndroidTest

      - name: Run Android provider recovery tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: cd packages/openkeychain_ssh/example/android && ./gradlew :openkeychain_ssh:connectedDebugAndroidTest

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install SSH handshake test server
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb lrzsz

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests (simple)
        run: xvfb-run flutter test integration_test/simple_test.dart -d linux

      - name: Run integration tests (local shell)
        run: xvfb-run flutter test integration_test/local_shell_test.dart -d linux

      - name: Run integration tests (ZMODEM IPC)
        run: xvfb-run flutter test integration_test/zmodem_ipc_test.dart -d linux
