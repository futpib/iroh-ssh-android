name: openkeychain_ssh
description: Android SSH authentication through OpenKeychain-compatible providers.
version: 0.1.0
homepage: https://github.com/futpib/iroh-ssh-android/tree/master/packages/openkeychain_ssh

environment:
  sdk: ^3.12.1
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.futpib.openkeychain_ssh
        pluginClass: OpenkeychainSshPlugin
